name: Publish

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # One leg per OS, the way jupyterlab splits linuxtests / macostests /
    # windowstests. The suite mocks electron, so no binary is needed and the
    # cost is a runner each; what it buys is the filesystem behaviour that only
    # differs by platform, which the config tests reach directly.
    name: 'Unit tests (${{ matrix.os }})'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      # Coverage thresholds only need enforcing once; the other legs are here
      # for the behaviour, not the numbers.
      - if: matrix.os == 'ubuntu-latest'
        run: yarn test:coverage
      - if: matrix.os != 'ubuntu-latest'
        run: yarn test:unit

  publish:
    needs: test
    # Matrix legs all compute the same values for these outputs.
    outputs:
      release_exists: ${{ steps.release-exists.outputs.result }}
      version: ${{ steps.package-info.outputs.version }}
    strategy:
      # Each leg builds an independent installer, so a flake on one platform
      # must not cancel the other three and throw away their artifacts.
      fail-fast: false
      matrix:
        cfg:
        - { platform: linux-64, platform_name: Linux x64,  os: ubuntu-latest, build_platform: linux-64, conda_platform: linux-64 }
        # Native Intel runner: macos-latest is arm64, and packing the osx-64
        # env there runs its x86_64 Python under Rosetta, which aborts conda
        # pack intermittently (#1018). macos-26-intel is the newest x86_64
        # image (GitHub offers no macos-latest-intel; -latest is arm64 only).
        - { platform: osx-64, platform_name: macOS x64, os: macos-26-intel, build_platform: osx-64, conda_platform: osx-64 }
        - { platform: osx-arm64, platform_name: macOS arm64, os: macos-latest, build_platform: osx-64, conda_platform: osx-arm64 }
        - { platform: win-64, platform_name: Windows x64, os: windows-latest, build_platform: win-64, conda_platform: win-64 }

    name: '${{ matrix.cfg.platform_name }} installer'
    runs-on: ${{ matrix.cfg.os }}
    defaults:
      run:
        # needed for conda to work
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          auto-update-conda: true
          auto-activate-base: true
          activate-environment: ""
          channels: conda-forge

      - run: conda install --file ./workflow_env/conda-${{ matrix.cfg.build_platform }}.lock -y

      - name: Install node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          npm install --global yarn --prefer-offline
          yarn install

      - name: Check JupyterLab version match
        run: |
          yarn check_version_match

      - name: Check Lint & Prettier
        run: |
          yarn lint:check

      - name: Get package info
        shell: bash
        id: package-info
        run: echo "version=$(python scripts/get_package_version.py)" >> $GITHUB_OUTPUT

      - name: 'Find Release with tag v${{ steps.package-info.outputs.version}}'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: release-exists
        env:
          APP_VERSION: ${{ steps.package-info.outputs.version}}
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            })
            const tagName = `v${process.env.APP_VERSION}`
            const releaseWithTag = releases.data.find(release => release.tag_name === tagName && (release.draft || release.prerelease))
            return releaseWithTag ? 'true' : 'false'
          result-encoding: string

      - name: Create Application Server Installer
        run: |
          yarn create_env_installer:${{ matrix.cfg.platform }}

      # contents of tarball needs to be signed for notarization
      - name: Codesign Application Server
        if: (matrix.cfg.platform == 'osx-64' || matrix.cfg.platform == 'osx-arm64') && steps.release-exists.outputs.result == 'true'
        env: 
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_FOR_PULL_REQUEST: true
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          ENV_INSTALLER_KEYCHAIN_PASS: ${{ secrets.ENV_INSTALLER_KEYCHAIN_PASS }}
        run: |
          echo "Extracting env installer"
          yarn extract_env_installer:${{ matrix.cfg.platform }}
          echo $CSC_LINK | base64 -d -o certificate.p12
          security create-keychain -p $ENV_INSTALLER_KEYCHAIN_PASS build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p $ENV_INSTALLER_KEYCHAIN_PASS build.keychain
          security import certificate.p12 -k build.keychain -P $CSC_KEY_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $ENV_INSTALLER_KEYCHAIN_PASS build.keychain
          echo "Signing env binaries"
          # Signing with --options=runtime contacts Apple's timestamp service
          # for every file; under thousands of sequential requests it
          # intermittently fails, so retry each file with backoff.
          while read line; do
            for attempt in 1 2 3 4 5; do
              if /usr/bin/codesign --force --options=runtime --deep -s "Developer ID Application" ./env_installer/jlab_server_extracted/"$line" -v; then
                break
              elif [ "$attempt" -eq 5 ]; then
                echo "Failed to sign $line after $attempt attempts"
                exit 1
              else
                echo "Signing $line failed (attempt $attempt), retrying..."
                sleep $((attempt * 10))
              fi
            done
          done < ./env_installer/sign-${{ matrix.cfg.platform }}.txt
          rm certificate.p12
          security delete-keychain build.keychain

      # recreate tarball after signing contents
      - name: Re-archive Application Server Installer
        if: (matrix.cfg.platform == 'osx-64' || matrix.cfg.platform == 'osx-arm64') && steps.release-exists.outputs.result == 'true'
        run: |
          yarn compress_env_installer:${{ matrix.cfg.platform }}
          rm -rf ./env_installer/jlab_server_extracted

      - name: Create Application Installer for Test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # disable code signing if not release asset
        run: |
          # dmgbuild intermittently cannot detach its disk image on hosted mac
          # runners ("hdiutil: couldn't eject disk2 - Resource busy", upstream
          # electron-builder#4606 and dmgbuild#26). Three separate PRs hit it in
          # one day, so retry once rather than spend a full matrix rerun on it.
          yarn dist:${{ matrix.cfg.platform }} || {
            echo "installer build failed, retrying once"
            sleep 15
            yarn dist:${{ matrix.cfg.platform }}
          }
        if: steps.release-exists.outputs.result == 'false'

      - name: Create Application Installer for Release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_FOR_PULL_REQUEST: true
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          # dmgbuild intermittently cannot detach its disk image on hosted mac
          # runners ("hdiutil: couldn't eject disk2 - Resource busy", upstream
          # electron-builder#4606 and dmgbuild#26). Three separate PRs hit it in
          # one day, so retry once rather than spend a full matrix rerun on it.
          yarn dist:${{ matrix.cfg.platform }} || {
            echo "installer build failed, retrying once"
            sleep 15
            yarn dist:${{ matrix.cfg.platform }}
          }
        if: steps.release-exists.outputs.result == 'true'

      - name: Upload Debian x64 Installer
        if: matrix.cfg.platform == 'linux-64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debian-installer-x64
          path: |
            dist/JupyterLab.deb

      - name: Upload Fedora x64 Installer
        if: matrix.cfg.platform == 'linux-64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora-installer-x64
          path: |
            dist/JupyterLab.rpm
      
      - name: Upload Snap Installer
        if: matrix.cfg.platform == 'linux-64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: snap-artifact
        with:
          name: snap-installer
          path: |
            dist/JupyterLab.snap

      - name: Verify the snap can actually launch
        if: matrix.cfg.platform == 'linux-64'
        run: |
          # neither snapd nor xvfb is listed in the runner image manifest, so do
          # not assume either is there
          missing=""
          command -v snap >/dev/null || missing="$missing snapd"
          command -v xvfb-run >/dev/null || missing="$missing xvfb"
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $missing
          fi
          # --dangerous skips assertion checks for a locally built snap, --classic
          # matches the confinement we ship with
          # snap install is known to hang on hosted runners
          # (actions/runner-images#11170), so bound it rather than let it eat the
          # job's budget
          # a snapd that apt just installed may still be seeding, and installing
          # during that fails with "too early for operation". best effort: if
          # snapd is not answering yet this cannot wait for it either
          sudo snap wait system seed.loaded || true
          sudo timeout 300 snap install --dangerous --classic dist/JupyterLab.snap
          # --version quits before any window is created, so this exercises
          # command.sh and every launcher script it execs, without needing a UI
          xvfb-run -a timeout 120 jupyterlab-desktop --version

      - name: Verify the deb can actually launch
        if: matrix.cfg.platform == 'linux-64'
        run: |
          # apt resolves the Depends the deb declares, so an under-declared
          # dependency fails here rather than on a user's machine
          sudo apt-get install -y ./dist/JupyterLab.deb
          # the deb keeps its binary under /opt and only symlinks jlab into
          # /usr/bin, so name the path and do not race the snap installed above
          xvfb-run -a timeout 120 /opt/JupyterLab/jupyterlab-desktop --version
          # the postinst's own two lines are the jlab symlink, and nothing else
          # here would notice if they pointed at a path the package does not
          # ship. pin the target, since the snap installed above also claims
          # /usr/bin/jlab and would satisfy a bare "is it executable" check
          test "$(readlink -f /usr/bin/jlab)" = /opt/JupyterLab/resources/app/jlab
          test -x /usr/bin/jlab

      - name: Verify the deb installs, reinstalls and removes cleanly
        if: matrix.cfg.platform == 'linux-64'
        run: |
          # Debian policy 6.5 requires maintainer scripts to be idempotent, and
          # unpacking over the copy installed above is the cheapest way to run
          # the postinst a second time against the state the first one left
          sudo dpkg -i ./dist/JupyterLab.deb
          # the profile ships in the package but only reaches apparmor.d if the
          # postinst installs it, which is what #870 turned on
          test -f /etc/apparmor.d/jupyterlab-desktop
          sudo apt-get purge -y jupyterlab-desktop
          test ! -e /etc/apparmor.d/jupyterlab-desktop
          # a note rather than an assertion: the postrm drops the alternatives
          # entry but not the jlab symlink, which the postinst creates outside
          # the package file list
          if [ -L /usr/bin/jlab ]; then
            echo 'note: /usr/bin/jlab is left behind by purge'
          fi

      - name: Verify the rpm can actually launch
        if: matrix.cfg.platform == 'linux-64'
        run: |
          # the runner is Ubuntu, so the rpm needs a RHEL-family userland of its
          # own. AlmaLinux 9 is a maintained rebuild sitting above every floor
          # Electron states for Linux, which are Debian 10, Fedora 32 and
          # Ubuntu 18.04. Rocky's Docker Official Image stopped being rebuilt in
          # 2024, and quay serves the same AlmaLinux image without Docker Hub's
          # anonymous pull limit, which hosted runners share an IP pool against
          docker run --rm -v "$PWD/dist:/dist:ro" quay.io/almalinuxorg/almalinux:9 bash -c '
            set -e
            dnf -y install /dist/JupyterLab.rpm xorg-x11-server-Xvfb
            Xvfb :99 -screen 0 1024x768x24 &
            # Electron needs the display to reach ready, and Xvfb takes a moment
            # to bind its socket, so waiting is the difference between this
            # gating the rpm and it failing at random
            for i in $(seq 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
            test -e /tmp/.X11-unix/X99
            # Chromium cannot set up its sandbox as root inside a container, and
            # this only needs to answer whether the binary runs on this libc
            DISPLAY=:99 timeout 120 /opt/JupyterLab/jupyterlab-desktop --version --no-sandbox
          '

      - name: Upload macOS x64 Installer
        if: matrix.cfg.platform == 'osx-64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-installer-x64
          path: |
            dist/JupyterLab-x64.dmg
            dist/JupyterLab-x64.zip

      - name: Upload macOS arm64 Installer
        if: matrix.cfg.platform == 'osx-arm64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-installer-arm64
          path: |
            dist/JupyterLab-arm64.dmg
            dist/JupyterLab-arm64.zip

      - name: Upload Windows x64 Installer
        if: matrix.cfg.platform == 'win-64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer-x64
          path: |
            dist/JupyterLab-Setup.exe
            dist/latest.yml

      - name: Publish snap to the latest/candidate channel in Snap Store
        if: matrix.cfg.platform == 'linux-64' && steps.release-exists.outputs.result == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: dist/JupyterLab.snap
          release: candidate

  upload-release-assets:
    name: Upload installers as release assets
    needs: publish
    # Job-level gate: when no matching draft or pre-release exists this job is
    # skipped before the environment is requested, so regular CI runs on pushes
    # and PRs never trip the release environment's protection rules.
    if: needs.publish.outputs.release_exists == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # uploading release assets only needs contents write
          permission-contents: write

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload Debian x64 Installer as Release asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          file: dist/JupyterLab.deb
          asset_name: JupyterLab-Setup-Debian-x64.deb
          tag: v${{ needs.publish.outputs.version }}
          overwrite: true

      - name: Upload Fedora x64 Installer as Release asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          file: dist/JupyterLab.rpm
          asset_name: JupyterLab-Setup-Fedora-x64.rpm
          tag: v${{ needs.publish.outputs.version }}
          overwrite: true

      - name: Upload macOS x64 Installer as Release asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          file: dist/JupyterLab-x64.dmg
          asset_name: JupyterLab-Setup-macOS-x64.dmg
          tag: v${{ needs.publish.outputs.version }}
          overwrite: true

      - name: Upload macOS arm64 Installer as Release asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          file: dist/JupyterLab-arm64.dmg
          asset_name: JupyterLab-Setup-macOS-arm64.dmg
          tag: v${{ needs.publish.outputs.version }}
          overwrite: true

      - name: Upload macOS x64 App as Release asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          file: dist/JupyterLab-x64.zip
          asset_name: JupyterLab-macOS-x64.zip
          tag: v${{ needs.publish.outputs.version }}
          overwrite: true

      - name: Upload macOS arm64 App as Release asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          file: dist/JupyterLab-arm64.zip
          asset_name: JupyterLab-macOS-arm64.zip
          tag: v${{ needs.publish.outputs.version }}
          overwrite: true

      - name: Upload Windows x64 Installer as Release asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          file: dist/JupyterLab-Setup.exe
          asset_name: JupyterLab-Setup-Windows-x64.exe
          tag: v${{ needs.publish.outputs.version }}
          overwrite: true

      - name: Upload latest.yml Release asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          file: dist/latest.yml
          asset_name: latest.yml
          tag: v${{ needs.publish.outputs.version }}
          overwrite: true

      - name: Upload snap installer as Release asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          file: dist/JupyterLab.snap
          asset_name: JupyterLab-Setup.snap
          tag: v${{ needs.publish.outputs.version }}
          overwrite: true
